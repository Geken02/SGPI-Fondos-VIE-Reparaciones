version: '3.8'

services:
  # Servidor de Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine  
    container_name: sgpi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: sgpi_db
    ports:
      - "5432:5432"
    volumes:
      # Scripts de inicialización en orden de ejecución
      - ./scripts/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./scripts/02_insert_catalogs.sql:/docker-entrypoint-initdb.d/02_insert_catalogs.sql
      - ./scripts/03_migraciones.sql:/docker-entrypoint-initdb.d/03_migraciones.sql
      - ./scripts/04_utilitario_logs.sql:/docker-entrypoint-initdb.d/04_utilitario_logs.sql
      - ./scripts/05_seed_pruebas.sql:/docker-entrypoint-initdb.d/05_seed_pruebas.sql
      - sgpi_db_data:/var/lib/postgresql/data
    networks:
      - sgpi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interfaz gráfica para administrar la base de datos 
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgpi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tec.ac.cr
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sgpi_network

volumes:
  sgpi_db_data:

networks:
  sgpi_network:
    driver: bridge