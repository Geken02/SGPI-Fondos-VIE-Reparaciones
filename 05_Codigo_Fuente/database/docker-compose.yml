version: '3.8'

services:
  # Servidor de Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine  
    container_name: sgpi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: sgpi_db
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./scripts/02_insert_catalogs.sql:/docker-entrypoint-initdb.d/02_insert_catalogs.sql
      - ./scripts/03_insertar_catalogos_logs.sql:/docker-entrypoint-initdb.d/03_insertar_catalogos_logs.sql
      - ./scripts/04_insertar_logs.sql:/docker-entrypoint-initdb.d/04_insertar_logs.sql
      - sgpi_db_data:/var/lib/postgresql/data
    networks:
      - sgpi_network

  # Interfaz gráfica para administrar la base de datos 
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgpi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tec.ac.cr
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - sgpi_network

volumes:
  sgpi_db_data:

networks:
  sgpi_network:
    driver: bridge